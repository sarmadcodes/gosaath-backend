name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # The contract is checked against the app's main branch: drift there is
      # exactly what this job exists to catch.
      GOSAATH_APP_DIR: ${{ github.workspace }}/gosaath
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: gosaath-backend

      # A contract change lands in both repos on a branch of the same name.
      # Check against that branch while it exists, so neither PR is red until
      # the other merges; everything else is checked against main.
      - name: Pick the app revision
        id: app
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/sarmadcodes/gosaath "refs/heads/$BRANCH" >/dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      # The app repo may be private, in which case GITHUB_TOKEN cannot read
      # it; add a read-only token as GOSAATH_REPO_TOKEN.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: sarmadcodes/gosaath
          ref: ${{ steps.app.outputs.ref }}
          path: gosaath
          token: ${{ secrets.GOSAATH_REPO_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gosaath-backend/package-lock.json

      - name: Install
        working-directory: gosaath-backend
        run: npm ci

      # Signing key for the test run only, regenerated every run. Locally it
      # comes from .env, which CI does not have.
      - name: Throwaway JWT secret
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # contract:check + typecheck + tests (in-memory MongoDB) + build.
      # No real secrets: tests/setup forces a throwaway database.
      - name: Verify
        working-directory: gosaath-backend
        run: npm run verify
